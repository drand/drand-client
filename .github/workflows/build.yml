name: build
on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  build_test_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Compile the typescript
        run: npm run build

      - name: Lint the code
        run: npm run lint

      - name: Run the tests
        run: npm test

      # Tagging happens only once the build is green, so a failed run does not consume a version.
      - name: Bump version and push tag
        if: github.ref == 'refs/heads/master'
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # LIB_VERSION is generated from package.json at build time, so rebuild after the bump.
      - name: Set package version from tag and rebuild
        if: github.ref == 'refs/heads/master'
        run: |
          npm version --no-git-tag-version "${{ steps.tag_version.outputs.new_version }}"
          npm run build

      - name: Copy relevant documentation into the build folder
        run: cp package.json README.md LICENSE-APACHE LICENSE-MIT ./build

      - name: Publish to npmjs
        if: github.ref == 'refs/heads/master'
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}
          package: package.json

      - name: Create a GitHub release
        if: github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
